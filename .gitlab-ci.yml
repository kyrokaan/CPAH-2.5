default:
  tags: [shared-windows, windows, windows-1809]

stages: [test, build, docs]

variables:
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
  UV_LINK_MODE: copy

cache:
  key: cpah-python-314
  paths: [.uv-cache/]

before_script:
  - py -3.14 -m pip install uv
  - py -3.14 -m uv sync --locked --all-extras

test:
  stage: test
  script:
    - py -3.14 -m uv run pytest --junitxml=report.xml
    - py -3.14 -m uv run ruff check cpah tests
  artifacts:
    when: always
    reports:
      junit: report.xml

build:
  stage: build
  script:
    - py -3.14 -m uv run pyinstaller --clean --noconfirm cpah.spec
    - Get-FileHash dist\cpah.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  cpah.exe" } | Set-Content dist\cpah.exe.sha256
    - .\dist\cpah.exe --version
    - $analysis = .\dist\cpah.exe --analyze-screenshot tests\screenshots\0.png --json | ConvertFrom-Json; if ($analysis.buffer_size -ne 5) { throw "Frozen screenshot smoke test failed" }
  artifacts:
    paths: [dist/cpah.exe, dist/cpah.exe.sha256]

pages:
  stage: docs
  script:
    - py -3.14 -m uv run mkdocs build --strict --verbose
  artifacts:
    paths: [public]
