[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cpah"
version = "2.5.0"
description = "External Cyberpunk 2077 breach puzzle analyzer and autohacker"
readme = "readme.md"
requires-python = ">=3.14,<3.15"
license = { file = "LICENSE" }
authors = [{ name = "Jsh" }, { name = "CPAH contributors" }]
dependencies = [
  "numpy>=2.3,<3",
  "opencv-python-headless>=4.11,<5",
  "Pillow>=11.3,<13",
  "pydantic>=2.11,<3",
  "PySide6>=6.10.1,<6.12",
  "pywin32>=310; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
]
build = ["pyinstaller>=6.15,<7"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.6,<10"]

[project.scripts]
cpah = "cpah.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["cpah"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
# Keep CI focused on correctness. The inherited 2021 UI and tests deliberately
# retain some older spelling and typing idioms until their next mechanical pass.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pyside6-project]
files = ["cpah/resources/uis/main.ui", "cpah/resources/uis/settings.ui"]
